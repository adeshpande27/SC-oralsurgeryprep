  const body = el('div','matrix-body');
  if(!state.markDraft[q.id]) state.markDraft[q.id] = {scores:{}, red:false, note:''};
  const draft = state.markDraft[q.id];
  const max = mx.crit.length * 3;

  const tests = el('div','mx-tests');
  tests.innerHTML = '<b style="color:var(--text-secondary);font-weight:600;">What this tests:</b> ' + mxEsc(mx.tests);
  body.appendChild(tests);

  mx.crit.forEach((c, ci) => {
    const row = el('div','mx-crit');
    const nm = el('div','mx-crit-name'); nm.textContent = (ci+1)+'. '+c[0]; row.appendChild(nm);
    const chips = el('div','mx-chips');
    [0,1,2,3].forEach(v => {
      const sel = draft.scores[ci] === v;
      const chip = el('button','mx-chip s'+v+(sel?' sel':''));
      chip.textContent = v;
      chip.addEventListener('click', () => {
        if(draft.scores[ci] === v) delete draft.scores[ci]; else draft.scores[ci] = v;
        lsSet('sh-markdraft', state.markDraft); render();
      });
      chips.appendChild(chip);
    });
    row.appendChild(chips);
    const leg = el('div','mx-legend');
    leg.innerHTML = '<b>1</b>'+mxEsc(c[1])+' &nbsp;·&nbsp; <b>2</b>'+mxEsc(c[2])+' &nbsp;·&nbsp; <b>3</b>'+mxEsc(c[3]);
    row.appendChild(leg);
    body.appendChild(row);
  });

  const red = el('div','mx-red');
  const redTxt = el('div'); redTxt.innerHTML = '<b>Red flag:</b> ' + mxEsc(mx.red);
  const redBtn = el('button','mx-redflag-btn'+(draft.red?' on':''));
  redBtn.textContent = draft.red ? '✓ Flagged' : 'Flag it';
  redBtn.addEventListener('click', () => { draft.red = !draft.red; lsSet('sh-markdraft', state.markDraft); render(); });
  red.appendChild(redTxt); red.appendChild(redBtn);
  body.appendChild(red);

  const dist = el('div','mx-dist');
  dist.innerHTML = '<b>A+ marker:</b> ' + mxEsc(mx.dist);
  body.appendChild(dist);

  let total = 0; mx.crit.forEach((_,ci)=> total += (draft.scores[ci] || 0));
  const band = mxBand(total, max, draft.red);
  const tot = el('div','mx-total');
  tot.innerHTML = '<div class="mx-total-num">'+total+'<span>/'+max+'</span></div>';
  const bandEl = el('span','mx-band'); bandEl.textContent = band.label;
  bandEl.style.background = band.bg; bandEl.style.color = band.tc;
  tot.appendChild(bandEl);
  body.appendChild(tot);

  const note = el('textarea','mx-note'); note.setAttribute('rows','2');
  note.setAttribute('placeholder','Notes on this run — what to fix next time…');
  note.value = draft.note || '';
  note.addEventListener('input', () => { draft.note = note.value; lsSet('sh-markdraft', state.markDraft); });
  body.appendChild(note);

  const save = el('button','mx-save'); save.textContent = 'Save this run';
  save.addEventListener('click', () => {
    let t = 0; mx.crit.forEach((_,ci)=> t += (draft.scores[ci] || 0));
    const arr = mx.crit.map((_,ci)=> draft.scores[ci] != null ? draft.scores[ci] : 0);
    const run = { date: new Date().toLocaleDateString('en-AU',{day:'2-digit',month:'short'}), scores:arr, red:!!draft.red, note:(draft.note||'').trim(), total:t };
    if(!state.marks[q.id]) state.marks[q.id] = [];
    state.marks[q.id].push(run);
    delete state.markDraft[q.id];
    lsSet('sh-marks', state.marks); lsSet('sh-markdraft', state.markDraft);
    render();
  });
  body.appendChild(save);

  const runs = state.marks[q.id] || [];
  const hist = el('div','mx-runs');
  const ht = el('div','mx-runs-title'); ht.textContent = 'Mock-run history'; hist.appendChild(ht);
  if(runs.length === 0){
    const em = el('div','mx-empty'); em.textContent = 'No runs saved yet. Score the four criteria, then Save this run to track her over time.'; hist.appendChild(em);
  } else {
    runs.forEach((r, ri) => {
      const row = el('div','mx-run');
      const d = el('span','mx-run-date'); d.textContent = r.date; row.appendChild(d);
      const sc = el('span','mx-run-score'); sc.textContent = r.total+'/'+max; row.appendChild(sc);
      if(r.red){ const rf = el('span','mx-run-redflag'); rf.textContent = '⚠ flag'; row.appendChild(rf); }
      const nt = el('span','mx-run-note'); nt.textContent = r.note || ''; row.appendChild(nt);
      const del = el('button','mx-run-del'); del.textContent = '✕';
      del.addEventListener('click', () => {
        state.marks[q.id].splice(ri,1);
        if(state.marks[q.id].length === 0) delete state.marks[q.id];
        lsSet('sh-marks', state.marks); render();
      });
      row.appendChild(del);
      hist.appendChild(row);
    });
  }
  body.appendChild(hist);

  return body;
}

function isAdded(id){ return parseInt(id.replace('q',''),10) > 17; }

function renderQuestionCard(q, num) {
  const cat = CATEGORIES[q.category];
  const color = cat.color;
  const isOpen = state.openQuestions[q.id];
  const expSteps = q.steps.map((s,i)=>({s,i})).filter(({s})=>s.isExp);
  const doneExp = expSteps.filter(({s,i})=>state.checked[`${q.id}-${i}`]).length;
  const totalExp = expSteps.length;
  const prog = totalExp > 0 ? Math.round(doneExp/totalExp*100) : 0;
  const isDone = totalExp > 0 && doneExp === totalExp;

  const card = el('div', `q-card${isOpen?' open':''}`);

  // trigger
  const trigger = el('button','q-trigger');
  const indexHtml = isDone
    ? `<div class="q-index done"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`
    : `<div class="q-index">${String(num).padStart(2,'0')}</div>`;

  let miniHtml = '';
  if (prog > 0 && !isDone) miniHtml = `<div class="q-mini-prog"><div class="q-mini-track"><div class="q-mini-fill fill-${color}" style="width:${prog}%"></div></div><span class="q-mini-label">${doneExp}/${totalExp} experience fields</span></div>`;
  if (isDone) miniHtml = `<div class="q-done-label">All experience fields complete</div>`;

  trigger.innerHTML = `
    <div class="q-left">
      ${indexHtml}
      <div class="q-text-wrap">
        <div class="q-text">${q.question}</div>
        ${miniHtml}
      </div>
    </div>
    <div class="q-right">
      ${isAdded(q.id) ? '<span class="origin-badge origin-added">Added</span>' : '<span class="origin-badge origin-original">Original</span>'}
      <span class="pill pill-${color}">${cat.label}</span>
      <svg class="chevron${isOpen?' open':''}" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>`;
  trigger.addEventListener('click', () => {
    state.openQuestions[q.id] = !state.openQuestions[q.id];
    render();
  });
  card.appendChild(trigger);

  if (isOpen) {
    const body = el('div','q-body');
    if (q.trap) {
      const tb = el('div','trap-box');
      tb.innerHTML = `<span class="trap-icon">⚠</span><p>${q.trap}</p>`;
      body.appendChild(tb);
    }
    const steps = el('div','steps');
    q.steps.forEach((step, si) => {
      const key = `${q.id}-${si}`;
      const isChecked = state.checked[key];
      const stepEl = el('div','step');

      const sh = el('div','step-header');
      if (step.isExp) {
        const cb = el('button', `checkbox ${color}${isChecked?' checked':''}`);
        cb.setAttribute('aria-label', isChecked ? 'Mark incomplete' : 'Mark complete');
        cb.innerHTML = isChecked ? '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5 4.5-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
        cb.addEventListener('click', () => {
          state.checked[key] = !state.checked[key];
          lsSet('sh-checked', state.checked);
          render();
        });
        sh.appendChild(cb);
      } else {
        sh.appendChild(el('div','step-dot'));
      }
      const sm = el('div','step-meta');
      sm.innerHTML = `<span class="step-label">${step.label}</span>${step.isExp ? `<span class="exp-badge exp-${color}">your experience</span>` : ''}`;
      sh.appendChild(sm);
      stepEl.appendChild(sh);

      const guidance = el('div','step-guidance');
      guidance.textContent = step.guidance;
      stepEl.appendChild(guidance);

      if (step.isExp) {
        const ta = el('textarea','step-textarea');
        ta.setAttribute('rows','3');
        ta.setAttribute('placeholder', step.prompt || 'Add your experience here…');
        ta.value = state.notes[key] || '';
        ta.addEventListener('input', () => {
          state.notes[key] = ta.value;
          lsSet('sh-notes', state.notes);
        });
        stepEl.appendChild(ta);
      }
      steps.appendChild(stepEl);
    });
    body.appendChild(steps);
    card.appendChild(body);

    // Model answer section
    if (q.model) {
      const modelOpen = state.openModels[q.id];
      const mt = el('button', `model-toggle${modelOpen ? ' open' : ''}`);
      mt.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.2"/><path d="M7 5v2.5M7 9.5v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Model answer <svg width="13" height="13" viewBox="0 0 13 13" fill="none" style="margin-left:auto"><path d="M3 5l3.5 3.5L10 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      mt.addEventListener('click', () => { state.openModels[q.id] = !state.openModels[q.id]; render(); });
      card.appendChild(mt);

      if (modelOpen) {
        const mb = el('div','model-body');
        mb.innerHTML = `<div class="model-label">Model answer — scaffold, not script</div><div class="model-text">${q.model.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\[INSERT[^\]]*\]/g, m => `<span style="color:var(--amber-text);font-style:italic;">${m}</span>`)}</div><div class="model-note">⚠ Use this as a structural reference only. Replace every [INSERT] with your specific experience. An answer that sounds like this but lacks your real cases will be detected immediately by an experienced panel.</div>`;
        card.appendChild(mb);
      }
    }
  }
  return card;
}

function renderScoreCard(q){
  const cat = CATEGORIES[q.category];
  const color = cat.color;
  const isOpen = state.openMatrix[q.id];
  const runs = state.marks[q.id] || [];
  const latest = runs.length ? runs[runs.length-1] : null;
  const max = MATRICES[q.id].crit.length * 3;
  const num = QUESTIONS.indexOf(q) + 1;

  const card = el('div', `q-card${isOpen?' open':''}`);
  const trigger = el('button','q-trigger');
  let badge = '';
  if (latest){
    const b = mxBand(latest.total, max, latest.red);
    badge = `<span class="score-badge" style="background:${b.bg};color:${b.tc}">${latest.red?'\u26a0 ':''}${latest.total}/${max}</span>`;
  }
  trigger.innerHTML = `
    <div class="q-left">
      <div class="q-index">${String(num).padStart(2,'0')}</div>
      <div class="q-text-wrap">
        <div class="q-text">${q.question}</div>
        ${runs.length ? `<div class="q-mini-label" style="margin-top:5px">${runs.length} run${runs.length>1?'s':''} saved</div>` : ''}
      </div>
    </div>
    <div class="q-right">
      ${badge}
      ${isAdded(q.id) ? '<span class="origin-badge origin-added">Added</span>' : '<span class="origin-badge origin-original">Original</span>'}
      <span class="pill pill-${color}">${cat.label}</span>
      <svg class="chevron${isOpen?' open':''}" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>`;
  trigger.addEventListener('click', () => { state.openMatrix[q.id] = !state.openMatrix[q.id]; render(); });
  card.appendChild(trigger);
  if (isOpen) card.appendChild(renderMatrixPanel(q, color));
  return card;
}

function renderScoringView(){
  const wrap = el('div');

  const hint = el('div','hint');
  hint.innerHTML = '<strong style="color:var(--text-secondary);font-weight:600">Examiner view.</strong> Pick the question being asked, expand it, score the four criteria 0\u20133, flag any red flag, then <strong style="color:var(--text-secondary);font-weight:500">Save this run</strong>. Each save is dated, so scores can be compared across mock interviews. Score against the criteria \u2014 not the model answer.';
  wrap.appendChild(hint);

  // session summary
  const totalQ = QUESTIONS.length;
  let scored=0, sum=0, flags=0;
  QUESTIONS.forEach(q => {
    const r = state.marks[q.id];
    if (r && r.length){ scored++; const l=r[r.length-1]; sum+=l.total; if(l.red) flags++; }
  });
  const avg = scored ? (sum/scored).toFixed(1) : '\u2014';
  const summary = el('div','score-summary');
  summary.innerHTML =
    `<div class="ss-item"><div class="ss-num">${scored}<span>/${totalQ}</span></div><div class="ss-lbl">questions scored</div></div>`+
    `<div class="ss-item"><div class="ss-num">${avg}<span>/12</span></div><div class="ss-lbl">avg latest run</div></div>`+
    `<div class="ss-item"><div class="ss-num" style="color:${flags?'var(--rose-text)':'var(--text-primary)'}">${flags}</div><div class="ss-lbl">red flags (latest)</div></div>`;
  wrap.appendChild(summary);

  wrap.appendChild(renderOriginToggle());

  // category filter (independent of the Questions tab)
  const allCats = ['ALL', ...Object.keys(CATEGORIES)];
  const fb = el('div','filter-bar');
  const fs = el('div','filter-scroll');
  allCats.forEach(cat => {
    const label = cat === 'ALL' ? 'All questions' : CATEGORIES[cat].label;
    const count = cat === 'ALL' ? QUESTIONS.length : QUESTIONS.filter(q=>q.category===cat).length;
    const btn = el('button', `filter-btn${state.scoreCategory===cat?' active':''}`);
    btn.innerHTML = `${label} <span class="filter-count">${count}</span>`;
    btn.addEventListener('click', () => { state.scoreCategory = cat; render(); });
    fs.appendChild(btn);
  });
  fb.appendChild(fs);
  wrap.appendChild(fb);

  let filtered = state.scoreCategory === 'ALL' ? QUESTIONS : QUESTIONS.filter(q=>q.category===state.scoreCategory);
  if (state.originFilter === 'original') filtered = filtered.filter(q=>!isAdded(q.id));
  else if (state.originFilter === 'added') filtered = filtered.filter(q=>isAdded(q.id));
  filtered.forEach(q => wrap.appendChild(renderScoreCard(q)));
  return wrap;
}

function renderTimetableView() {
  const wrap = el('div');

  // interview banner
  wrap.innerHTML = `
    <div class="interview-banner">
      <div class="banner-date"><div class="banner-day">2</div><div class="banner-month">July</div></div>
      <div><div class="banner-label">Interview day</div><div class="banner-title">University of Sydney · Sydney Dental School</div><div class="banner-sub">GradDip Clinical Dentistry (Surgical Dentistry)</div></div>
    </div>
    <div class="non-neg">
      <div class="non-neg-title">Non-negotiable daily habits</div>
      ${NON_NEG.map(r=>`<div class="non-neg-row"><span class="non-neg-bullet">—</span><span>${r}</span></div>`).join('')}
    </div>`;

  const phases = el('div','phases');
  PHASES.forEach(phase => {
    const isOpen = state.openPhases[phase.id];
    const totalTasks = phase.days.reduce((a,d)=>a+d.tasks.length,0);
    const doneTasks = phase.days.reduce((a,d)=>a+d.tasks.filter((_,ti)=>state.daysDone[`${d.n}-${ti}`]).length,0);

    const pb = el('div',`phase-block${isOpen?' open':''}`);
    const ph = el('button','phase-header');
    ph.innerHTML = `
      <div class="phase-left">
        <span class="pill pill-${phase.color}">${phase.label}</span>
        <div><div class="phase-title">${phase.title}</div><div class="phase-sub">${phase.subtitle}</div></div>
      </div>
      <div class="phase-right">
        <span class="phase-count">${doneTasks}/${totalTasks}</span>
        <svg class="chevron${isOpen?' open':''}" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>`;
    ph.addEventListener('click', () => { state.openPhases[phase.id] = !state.openPhases[phase.id]; render(); });
    pb.appendChild(ph);

    if (isOpen) {
      const body = el('div','phase-body');
      const grid = el('div','day-grid');
      phase.days.forEach(day => {
        const dc = el('div', `day-card${day.isInterview?' interview':''}${day.highlight?' highlight':''}`);
        dc.innerHTML = `<div class="day-label">${day.label}</div><div class="day-date">${day.date}</div>`;
        const tl = el('ul','task-list');
        day.tasks.forEach((task, ti) => {
          const key = `${day.n}-${ti}`;
          const done = state.daysDone[key];
          const li = el('li', `task-item${done?' done':''}`);
          li.innerHTML = `<span class="task-check">${done?'✓':'·'}</span><span>${task}</span>`;
          li.addEventListener('click', () => {
            state.daysDone[key] = !state.daysDone[key];
            lsSet('sh-days', state.daysDone);
            render();
          });
          tl.appendChild(li);
        });
        dc.appendChild(tl);
        grid.appendChild(dc);
      });
      body.appendChild(grid);
      pb.appendChild(body);
    }
    phases.appendChild(pb);
  });
  wrap.appendChild(phases);

  // daily structure
  const ds = el('div','daily-section');
  ds.innerHTML = `<div class="daily-title">Daily session structure · 90 min max</div>` +
    DAILY.map(b=>`<div class="daily-row"><div class="daily-time">${b.time}</div><div><div class="daily-block-title">${b.title}</div><div class="daily-desc">${b.desc}</div></div></div>`).join('');
  wrap.appendChild(ds);
  return wrap;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderHeader());
  const main = el('div','main');
  const container = el('div','container');
  let viewEl;
  if (state.view === 'questions') viewEl = renderQuestionsView();
  else if (state.view === 'timetable') viewEl = renderTimetableView();
  else viewEl = renderScoringView();
  container.appendChild(viewEl);
  main.appendChild(container);
  app.appendChild(main);
}

render();
</script>
</body>
</html>
