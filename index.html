<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interview Prep — Shimsha</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-base:#0d0f14;--bg-surface:#13161d;--bg-card:#181c25;--bg-elevated:#1e2330;
  --border-subtle:#232838;--border-mid:#2d3345;--border-strong:#3a4158;
  --text-primary:#e8e4d8;--text-secondary:#9ba3b8;--text-muted:#5c6478;--text-faint:#3a4158;
  --teal:#3d9e82;--teal-dim:#1e4d3e;--teal-text:#6ecfb0;
  --amber:#c4813a;--amber-dim:#3d2810;--amber-text:#e8a85e;
  --rose:#b04a4a;--rose-dim:#3d1515;--rose-text:#e07070;
  --violet:#6b5acd;--violet-dim:#1e1a40;--violet-text:#a090f0;
  --slate:#4a5578;--slate-dim:#1a1f30;--slate-text:#8090b8;
  --font-display:'Lora',Georgia,serif;--font-body:'Inter',-apple-system,sans-serif;
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-pill:999px;--tx:180ms ease;
}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-body);line-height:1.6;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg-base)}::-webkit-scrollbar-thumb{background:var(--border-mid);border-radius:3px}
button{cursor:pointer;font-family:var(--font-body)}
textarea{font-family:var(--font-body)}

/* HEADER */
.header{background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);position:sticky;top:0;z-index:100}
.header-inner{max-width:900px;margin:0 auto;padding:18px 24px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px}
.h-title{font-family:var(--font-display);font-size:21px;font-weight:500;color:var(--text-primary);letter-spacing:-.3px;margin-bottom:7px}
.meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meta-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary)}
.meta-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.nav{display:flex;gap:3px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:3px;flex-shrink:0;align-self:flex-start;margin-top:2px}
.nav-btn{background:transparent;border:none;padding:7px 16px;border-radius:var(--r-md);font-size:13px;color:var(--text-muted);transition:all var(--tx);font-weight:500}
.nav-btn:hover{color:var(--text-secondary);background:var(--bg-elevated)}
.nav-btn.active{background:var(--bg-elevated);color:var(--text-primary)}
.export-btn{background:var(--teal-dim);border:1px solid var(--teal);border-radius:var(--r-md);padding:7px 14px;font-size:12px;font-weight:500;color:var(--teal-text);transition:all var(--tx);flex-shrink:0;align-self:flex-start;margin-top:2px;white-space:nowrap}
.export-btn:hover{background:var(--teal);color:#fff}
.prog-bar-wrap{border-top:1px solid var(--border-subtle);padding:8px 24px}
.prog-bar-inner{max-width:900px;margin:0 auto}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:5px}
.prog-track{height:3px;background:var(--border-subtle);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--violet));border-radius:2px;transition:width .5s ease}

/* LAYOUT */
.main{padding:26px 0 80px}
.container{max-width:900px;margin:0 auto;padding:0 24px}

/* FILTER BAR */
.filter-bar{margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-scroll{display:flex;gap:5px;padding-bottom:2px}
.filter-btn{display:flex;align-items:center;gap:5px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-pill);padding:5px 13px;font-size:12px;color:var(--text-secondary);white-space:nowrap;transition:all var(--tx);flex-shrink:0}
.filter-btn:hover{border-color:var(--border-mid);color:var(--text-primary)}
.filter-btn.active{background:var(--bg-elevated);border-color:var(--border-strong);color:var(--text-primary)}
.filter-count{background:var(--bg-elevated);border-radius:var(--r-pill);padding:1px 6px;font-size:10px;color:var(--text-muted)}
.hint{font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.5}

/* QUESTION CARD */
.q-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);margin-bottom:7px;overflow:hidden;transition:border-color var(--tx)}
.q-card.open{border-color:var(--border-mid)}
.q-trigger{width:100%;background:none;border:none;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;color:var(--text-primary);transition:background var(--tx)}
.q-trigger:hover{background:var(--bg-elevated)}
.q-left{display:flex;align-items:flex-start;gap:12px;flex:1;min-width:0}
.q-index{width:27px;height:27px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border-mid);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:var(--text-muted);transition:all var(--tx)}
.q-index.done{background:var(--teal-dim);border-color:var(--teal);color:var(--teal-text)}
.q-text-wrap{flex:1;min-width:0}
.q-text{font-size:14px;font-weight:500;color:var(--text-primary);line-height:1.45}
.q-mini-prog{display:flex;align-items:center;gap:7px;margin-top:5px}
.q-mini-track{width:55px;height:3px;background:var(--border-subtle);border-radius:2px;overflow:hidden;flex-shrink:0}
.q-mini-fill{height:100%;border-radius:2px;transition:width .3s ease}
.q-mini-label{font-size:11px;color:var(--text-muted)}
.q-done-label{font-size:11px;color:var(--teal-text);margin-top:4px}
.q-right{display:flex;align-items:center;gap:9px;flex-shrink:0;color:var(--text-muted)}
.pill{font-size:10px;font-weight:500;letter-spacing:.04em;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap}
.pill-teal{background:var(--teal-dim);color:var(--teal-text)}
.pill-violet{background:var(--violet-dim);color:var(--violet-text)}
.pill-amber{background:var(--amber-dim);color:var(--amber-text)}
.pill-rose{background:var(--rose-dim);color:var(--rose-text)}
.pill-slate{background:var(--slate-dim);color:var(--slate-text)}
.chevron{transition:transform 200ms ease;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}

/* CARD BODY */
.q-body{border-top:1px solid var(--border-subtle);padding:18px 18px 22px}
.trap-box{background:var(--rose-dim);border:1px solid var(--rose);border-radius:var(--r-md);padding:11px 14px;display:flex;gap:9px;align-items:flex-start;margin-bottom:18px}
.trap-icon{color:var(--rose-text);font-size:13px;flex-shrink:0;margin-top:1px}
.trap-box p{font-size:13px;color:var(--rose-text);line-height:1.6}
.steps{display:flex;flex-direction:column}
.step{padding:13px 0;border-bottom:1px solid var(--border-subtle)}
.step:last-child{border-bottom:none;padding-bottom:0}
.step-header{display:flex;align-items:flex-start;gap:9px;margin-bottom:7px}
.checkbox{width:17px;height:17px;border-radius:var(--r-sm);border:1px solid var(--border-mid);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all var(--tx);color:transparent}
.checkbox.teal:hover{border-color:var(--teal)}.checkbox.teal.checked{background:var(--teal);border-color:var(--teal);color:#fff}
.checkbox.violet:hover{border-color:var(--violet)}.checkbox.violet.checked{background:var(--violet);border-color:var(--violet);color:#fff}
.checkbox.amber:hover{border-color:var(--amber)}.checkbox.amber.checked{background:var(--amber);border-color:var(--amber);color:#fff}
.checkbox.rose:hover{border-color:var(--rose)}.checkbox.rose.checked{background:var(--rose);border-color:var(--rose);color:#fff}
.checkbox.slate:hover{border-color:var(--slate)}.checkbox.slate.checked{background:var(--slate);border-color:var(--slate);color:#fff}
.step-dot{width:5px;height:5px;border-radius:50%;background:var(--border-mid);flex-shrink:0;margin-top:8px;margin-left:6px}
.step-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:1}
.step-label{font-size:13px;font-weight:500;color:var(--text-primary);line-height:1.4}
.exp-badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:var(--r-pill);letter-spacing:.03em;white-space:nowrap}
.exp-teal{background:var(--teal-dim);color:var(--teal-text)}
.exp-violet{background:var(--violet-dim);color:var(--violet-text)}
.exp-amber{background:var(--amber-dim);color:var(--amber-text)}
.exp-rose{background:var(--rose-dim);color:var(--rose-text)}
.exp-slate{background:var(--slate-dim);color:var(--slate-text)}
.step-guidance{font-size:13px;color:var(--text-secondary);line-height:1.65;padding-left:26px;margin-bottom:9px}
.step-textarea{background:var(--bg-elevated);border:1px solid var(--border-mid);border-radius:var(--r-md);padding:9px 11px;font-size:13px;color:var(--text-primary);line-height:1.6;resize:vertical;min-height:70px;outline:none;transition:border-color var(--tx);margin-left:26px;width:calc(100% - 26px)}
.step-textarea::placeholder{color:var(--text-faint)}
.step-textarea:focus{border-color:var(--border-strong)}

/* FILL COLORS */

.model-toggle{width:100%;background:none;border:none;border-top:1px solid var(--border-subtle);padding:10px 18px;display:flex;align-items:center;gap:8px;color:var(--violet-text);font-size:12px;font-weight:500;transition:background var(--tx);text-align:left;}
.model-toggle:hover{background:var(--violet-dim);}
.model-toggle svg{flex-shrink:0;transition:transform 200ms ease;}
.model-toggle.open svg{transform:rotate(180deg);}
.model-body{border-top:1px solid var(--border-subtle);background:var(--violet-dim);padding:18px 20px;}
.model-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-text);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.model-label::after{content:'';flex:1;height:1px;background:var(--violet-dim);filter:brightness(1.5);}
.model-text{font-size:13px;color:#c0bcd0;line-height:1.8;white-space:pre-wrap;}
.model-text [INSERT]{color:var(--amber-text);font-style:italic;}
.model-note{font-size:11px;color:var(--violet-text);margin-top:12px;padding-top:10px;border-top:1px solid rgba(107,90,205,.2);line-height:1.5;}
.fill-teal{background:var(--teal)}
.fill-violet{background:var(--violet)}
.fill-amber{background:var(--amber)}
.fill-rose{background:var(--rose)}
.fill-slate{background:var(--slate)}

/* TIMETABLE */
.interview-banner{display:flex;align-items:center;gap:18px;background:var(--bg-card);border:1px solid var(--border-mid);border-left:3px solid var(--teal);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:18px}
.banner-date{text-align:center;flex-shrink:0;padding-right:18px;border-right:1px solid var(--border-subtle)}
.banner-day{font-family:var(--font-display);font-size:38px;font-weight:500;color:var(--teal-text);line-height:1}
.banner-month{font-size:11px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.banner-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-text);margin-bottom:3px}
.banner-title{font-size:15px;font-weight:500;color:var(--text-primary)}
.banner-sub{font-size:13px;color:var(--text-secondary);margin-top:2px}
.non-neg{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:15px 18px;margin-bottom:22px}
.non-neg-title{font-size:12px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:11px}
.non-neg-row{display:flex;gap:9px;font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:7px}
.non-neg-row:last-child{margin-bottom:0}
.non-neg-bullet{color:var(--text-muted);flex-shrink:0}
.phases{display:flex;flex-direction:column;gap:7px;margin-bottom:26px}
.phase-block{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);overflow:hidden;transition:border-color var(--tx)}
.phase-block.open{border-color:var(--border-mid)}
.phase-header{width:100%;background:none;border:none;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;color:var(--text-primary);transition:background var(--tx)}
.phase-header:hover{background:var(--bg-elevated)}
.phase-left{display:flex;align-items:center;gap:12px}
.phase-title{font-size:14px;font-weight:500;color:var(--text-primary)}
.phase-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.phase-right{display:flex;align-items:center;gap:9px;color:var(--text-muted)}
.phase-count{font-size:12px;color:var(--text-muted)}
.phase-body{border-top:1px solid var(--border-subtle);padding:15px 18px 18px}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:9px}
.day-card{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:13px}
.day-card.interview{border-color:var(--teal);background:var(--teal-dim)}
.day-card.highlight{border-color:var(--border-mid)}
.day-label{font-size:10px;letter-spacing:.06em;color:var(--text-muted);margin-bottom:2px}
.day-date{font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:9px}
.task-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.task-item{display:flex;gap:7px;font-size:12px;color:var(--text-secondary);line-height:1.5;cursor:pointer;transition:color var(--tx);user-select:none}
.task-item:hover{color:var(--text-primary)}
.task-item.done{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--text-faint)}
.task-check{flex-shrink:0;color:var(--text-muted);font-size:11px;margin-top:1px}
.task-item.done .task-check{color:var(--teal-text)}
.daily-section{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:18px}
.daily-title{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:14px}
.daily-row{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--border-subtle)}
.daily-row:last-child{border-bottom:none;padding-bottom:0}
.daily-time{font-size:11px;color:var(--text-muted);min-width:62px;padding-top:2px;flex-shrink:0}
.daily-block-title{font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:2px}
.daily-desc{font-size:12px;color:var(--text-secondary);line-height:1.6}

@media(max-width:600px){.container{padding:0 14px}.header-inner{padding:14px 14px 12px}.prog-bar-wrap{padding:7px 14px}.h-title{font-size:18px}.day-grid{grid-template-columns:1fr 1fr}}

/* MARKING MATRIX */
.matrix-toggle{width:100%;background:var(--slate-dim);border:none;border-top:1px solid var(--border-subtle);padding:12px 18px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:var(--slate-text);transition:background var(--tx)}
.matrix-toggle:hover{background:var(--bg-elevated)}
.matrix-toggle .chev{transition:transform var(--tx)}
.matrix-toggle.open .chev{transform:rotate(180deg)}
.matrix-body{background:var(--bg-surface);border-top:1px solid var(--border-subtle);padding:16px 18px 18px}
.mx-tests{font-size:12px;color:var(--text-secondary);margin-bottom:16px;line-height:1.55}
.mx-crit{margin-bottom:15px}
.mx-crit-name{font-size:12.5px;font-weight:600;color:var(--text-primary);margin-bottom:7px}
.mx-chips{display:flex;gap:6px;margin-bottom:6px}
.mx-chip{width:32px;height:32px;border-radius:var(--r-md);border:1px solid var(--border-mid);background:var(--bg-card);color:var(--text-muted);font-size:13px;font-weight:600;transition:all var(--tx)}
.mx-chip:hover{border-color:var(--border-strong);color:var(--text-secondary)}
.mx-chip.sel{color:#fff}
.mx-chip.sel.s0{background:var(--text-faint);border-color:var(--text-muted);color:var(--text-primary)}
.mx-chip.sel.s1{background:var(--rose);border-color:var(--rose)}
.mx-chip.sel.s2{background:var(--amber);border-color:var(--amber)}
.mx-chip.sel.s3{background:var(--teal);border-color:var(--teal)}
.mx-legend{font-size:11px;color:var(--text-muted);line-height:1.5}
.mx-legend b{color:var(--text-secondary);font-weight:600;margin-right:2px}
.mx-red{display:flex;align-items:flex-start;gap:10px;background:var(--rose-dim);border:1px solid var(--rose);border-radius:var(--r-md);padding:10px 12px;margin:8px 0 14px;font-size:11.5px;color:var(--rose-text);line-height:1.55}
.mx-red>div{flex:1}
.mx-redflag-btn{flex-shrink:0;background:transparent;border:1px solid var(--rose);border-radius:var(--r-pill);padding:4px 11px;font-size:11px;color:var(--rose-text);white-space:nowrap;transition:all var(--tx)}
.mx-redflag-btn.on{background:var(--rose);color:#fff}
.mx-dist{font-size:11.5px;color:var(--teal-text);background:var(--teal-dim);border-radius:var(--r-md);padding:9px 12px;margin-bottom:6px;line-height:1.55}
.mx-dist b{font-weight:600}
.mx-total{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 8px;border-top:1px solid var(--border-subtle);margin-top:10px}
.mx-total-num{font-family:var(--font-display);font-size:22px;color:var(--text-primary)}
.mx-total-num span{font-size:13px;color:var(--text-muted)}
.mx-band{font-size:11px;padding:4px 11px;border-radius:var(--r-pill);font-weight:600}
.mx-note{width:100%;background:var(--bg-card);border:1px solid var(--border-mid);border-radius:var(--r-md);padding:9px 11px;color:var(--text-primary);font-size:12px;resize:vertical;margin:6px 0 10px;line-height:1.5;font-family:var(--font-body)}
.mx-note:focus{outline:none;border-color:var(--border-strong)}
.mx-save{background:var(--teal-dim);border:1px solid var(--teal);border-radius:var(--r-md);padding:8px 16px;font-size:12px;font-weight:500;color:var(--teal-text);transition:all var(--tx)}
.mx-save:hover{background:var(--teal);color:#fff}
.mx-runs{margin-top:18px;border-top:1px solid var(--border-subtle);padding-top:13px}
.mx-runs-title{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:9px}
.mx-run{display:flex;align-items:center;gap:11px;padding:7px 0;border-bottom:1px solid var(--border-subtle);font-size:12px}
.mx-run:last-child{border-bottom:none}
.mx-run-date{color:var(--text-secondary);min-width:50px}
.mx-run-score{font-weight:600;color:var(--text-primary);min-width:42px}
.mx-run-redflag{color:var(--rose-text);font-size:11px}
.mx-run-note{color:var(--text-muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-run-del{background:none;border:none;color:var(--text-faint);font-size:14px;padding:2px 6px;flex-shrink:0}
.mx-run-del:hover{color:var(--rose-text)}
.mx-empty{font-size:11.5px;color:var(--text-muted);font-style:italic;line-height:1.5}
/* SCORING VIEW */
.score-summary{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.ss-item{flex:1;min-width:96px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:12px 14px}
.ss-num{font-family:var(--font-display);font-size:22px;color:var(--text-primary);line-height:1.2}
.ss-num span{font-size:12px;color:var(--text-muted)}
.ss-lbl{font-size:11px;color:var(--text-muted);margin-top:3px}
.score-badge{font-size:11px;padding:3px 9px;border-radius:var(--r-pill);font-weight:600;white-space:nowrap}

.origin-badge{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:var(--r-pill);white-space:nowrap}
.origin-original{background:var(--bg-elevated);color:var(--text-muted);border:1px solid var(--border-subtle)}
.origin-added{background:var(--violet-dim);color:var(--violet-text);border:1px solid var(--violet)}

.origin-toggle{display:inline-flex;gap:4px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:4px;margin-bottom:14px}

const QUESTIONS = [
  {id:'q09',model:`The moment I knew was a specific case — [INSERT THE CASE: what was it, what happened, what did you do, what did the patient experience]. That case did something that most of dentistry doesn't: it required me to hold the complexity of anatomy, medical risk, patient fear, and technical execution simultaneously under real pressure, and when it resolved well, that resolution was immediate and unambiguous. That combination — the intellectual and the technical demand, with a clear outcome — is what drew me toward surgery.

What keeps me interested is the anatomy. Oral surgery sits at the intersection of structures — the inferior alveolar nerve, the maxillary sinus, the fascial spaces, the airway — in a way that requires continuous three-dimensional spatial reasoning. I find that intellectually demanding in a way that motivates rather than exhausts me.

The breadth of the specialty is also genuinely compelling. Oral surgery touches oncology, trauma, implantology, pathology, and increasingly the medical interface around bisphosphonate-related osteonecrosis and medication-related conditions. That scope means the clinical questions don't plateau — there's always something more complex ahead.

My long-term intention is to progress from this GradDip to the Doctor of Clinical Dentistry in Oral Surgery, and ultimately to specialist registration. I'm clear that this program is Step 1, not the destination. [ADD: where you see yourself in 10 years — public hospital, private specialist practice, academic component, sub-specialisation interest if any].`,category:'MOTIVATION',question:'Why do you enjoy oral surgery?',trap:'SOFT TRAP: This feels easy but candidates give answers indistinguishable from each other — "I like working with my hands", "I love seeing immediate results." Make this specific to you.',steps:[
    {label:'A specific moment that crystallised it',guidance:'Not "I\'ve always been interested." Name a case, a procedure, a patient outcome that made you certain this was the direction.',prompt:'What was the case or moment? What did you feel? Why did it matter?',isExp:true},
    {label:'The intellectual pull',guidance:'What aspect of oral surgery thinking appeals — anatomy, decision-making under uncertainty, reconstructive planning, interface with medicine? Be specific.',prompt:'What do you find yourself reading about, thinking about, wanting to learn more of?',isExp:true},

    id:"q36",

    question:"Why the Graduate Diploma rather than going straight for the doctorate?",
    trap:"TRAP: Never frame this as a fallback or a fix for an application mix-up, and never volunteer the application error. The honest, strong line is forward-looking \u2014 the GradDip is the deliberate right entry point.",
    model:"For me the Graduate Diploma is the right entry point, not a lesser one. I've built a genuine operative foundation \u2014 surgical extractions, supervised impacted third molars, on-call trauma and haemorrhage \u2014 but I'm clear-eyed that the step from that to independent, specialist-level surgery is a real one, and I'd rather build it properly than rush it. The Diploma gives me a structured year of graded surgical exposure, teaching, and research before I take on the doctorate, and I think arriving at the DClinDent already grounded in that foundation makes me a stronger trainee, not a slower one. So I see this as a deliberate first step toward the doctorate and specialist registration \u2014 the sequence I'd choose even if both doors were open.",

  {id:'q05',model:`I work across two settings, and that dual exposure is the most honest answer to this question.

At Westmead Centre for Oral Health, which is a major public hospital referral centre, I see a case mix that most general dental graduates don't encounter. Medically complex patients — ASA III and above, patients on anticoagulation, patients with a history of bisphosphonate use, immunocompromised patients — are routine rather than exceptional. [INSERT APPROXIMATE CASE NUMBERS: extractions per week/month, proportion surgical vs simple, third molar cases]. The multidisciplinary environment means I'm regularly communicating with medical teams, anaesthetists, and specialists in a way that pure private practice doesn't require.

At Kings Family Dental Centre, I have independent clinical decision-making. Every treatment plan, every consent conversation, every post-operative complication is mine to manage without a registrar above me. That independence builds a different kind of judgment — knowing when you're at the edge of what's appropriate for your setting, and what to do about it.

The layer underneath both of those is my BDS training at Mysore and then the ADC pathway. I trained in an environment with a different disease burden — advanced pathology, patients presenting late, resource constraints that forced clinical decision-making without ideal investigations. Many Australian-trained graduates have technically excellent training but narrower case exposure in terms of pathology severity. [INSERT SPECIFIC CASE TYPE OR CONDITION FROM MYSORE THAT ILLUSTRATES THIS]. That background is not a gap in my training — it's a specific form of experience that I've built on.`,category:'EXPERIENCE',question:'What experience do you have that you can bring to this course?',trap:null,steps:[
    {label:'Volume and breadth — use numbers',guidance:'Numbers matter. How many extractions? Simple vs surgical? Impacted third molars? Estimate conservatively and state it.',prompt:'Approximate case numbers at Westmead and Kings Family. Types of procedures performed.',isExp:true},
    {label:'Westmead as a public hospital asset',guidance:'Westmead is a major referral centre. The complexity — medically compromised patients, complex surgical cases, multidisciplinary environment — is a genuine differentiator. Name it explicitly.',prompt:'What is the most complex or unusual case mix you\'ve encountered at Westmead?',isExp:true},
    {label:'Private practice contrast',guidance:'Kings Family Dental gives you independent decision-making, patient continuity, and business-of-care experience. Both settings are relevant.',prompt:'What have you managed independently in private that you wouldn\'t in a public setting?',isExp:true},
    {label:'BDS Mysore + ADC as an asset, not a footnote',guidance:'Different disease burden, patient demographics, resource-limited problem-solving. Many Australian-trained graduates haven\'t seen the pathology volume you have. Own this.',prompt:'Cases or conditions from your Indian training that give you perspective Australian graduates may lack.',isExp:true},
  ]},
  {
    id:"q38",
    category:"EXPERIENCE",
    question:"How does your overseas training compare with Australian-trained graduates?",
    trap:"SOFT TRAP: Don't be apologetic about overseas training, and don't disparage Australian training to elevate her own. Frame it as a complementary asset plus active bridging.",
    model:"I'd frame my overseas training as a specific asset rather than something to apologise for. My BDS at Mysore and the ADC pathway gave me exposure to a disease burden many Australian-trained graduates simply haven't seen \u2014 advanced pathology, patients presenting late, oral cancers tied to community risk factors, and the resource constraints that force sound clinical decisions without every investigation on hand. That builds judgment and resilience. The ADC process itself made me rigorous about meeting Australian standards explicitly, rather than absorbing them by osmosis. Where the systems differ \u2014 protocols, materials, referral pathways \u2014 I've actively bridged that through my work at Westmead and my CPD. So the honest answer is that my background isn't a gap to be managed; it's a different and complementary set of experiences I've built onto an Australian foundation.",
    steps:[

    model:"\u2699 DRAFT SCAFFOLD \u2014 direction only; build the full answer with Ani.\n\nName the real ceiling honestly and specifically \u2014 e.g. complex impactions she's done supervised but not solo, cases she would refer. Frame honesty about scope as a surgical skill (links to the 'beyond your scope' question). Close forward: this is precisely what the training is for.",

  {id:'q04',model:`Peri-operative care is the full continuum of patient management around a surgical procedure — it doesn't begin when I pick up the forceps and end when the patient leaves the chair. It begins at the first consultation and ends when I'm satisfied the patient has healed without complication.

Pre-operatively, my assessment is structured: medical history with formal ASA classification and risk stratification, medication review with specific attention to anticoagulants, antiplatelets, bisphosphonates, and immunosuppressants, relevant investigations — OPG routinely, CBCT where anatomical complexity warrants it, bloods if the medical history demands it. Informed consent is a process, not a signature — I discuss risks, alternatives, and realistic expectations at the consultation, not five minutes before I start. And I make an explicit anaesthetic decision: can this be safely done under LA, does this patient need sedation, or does this need to go to GA — and at Westmead I triage the GA referrals accordingly. [ADD SPECIFIC EXAMPLE OF A COMPLEX PRE-OP ASSESSMENT].

Intra-operatively, I'm monitoring the patient continuously — not just the technical steps. Communication with the nurse or assistant is part of the procedure. And when something unexpected happens — a root fractures, access is worse than the radiograph suggested — I have a decision framework for managing that in real time rather than escalating to anxiety. [ADD SPECIFIC INTRA-OP ADAPTATION EXAMPLE].

Post-operatively, I'm not satisfied with handing a printed sheet. I give verbal and written instructions, I ensure the patient or carer can repeat back the key warning signs — bleeding that doesn't settle, fever, worsening pain after 48 hours — and I have a system for follow-up. At Westmead, complex surgical cases are reviewed at a set interval. If a patient doesn't attend follow-up, that's flagged. The loop needs to close.`,category:'CLINICAL',question:'What does peri-operative care mean to you and how do you assess it?',trap:null,steps:[
    {label:'Define the three phases clearly',guidance:'Peri-operative = pre-operative + intra-operative + post-operative. Each phase has distinct goals — don\'t collapse them.',prompt:'',isExp:false},
    {label:'Pre-operative assessment structure',guidance:'(1) Medical history — ASA classification, risk stratification. (2) Medications — anticoagulants, bisphosphonates, immunosuppression. (3) Investigations — OPG, CBCT, bloods if relevant. (4) Informed consent. (5) Anaesthetic consideration — LA, sedation, or GA referral.',prompt:'What does your current pre-op assessment look like? How do you triage GA referrals at Westmead?',isExp:true},

  ]},

    model:"\u2699 DRAFT SCAFFOLD \u2014 direction only; build the full answer with Ani.\n\nStructured and confident: assessment (history, exam, OPG \u00b1 CBCT, signs of IAN proximity, Winter and Pell-Gregory classification), consent on the specific risks, technique (flap design, bone removal, sectioning, delivery, debridement, closure), then post-op instructions, complication recognition, and follow-up. Tie it to your supervised MOS experience with Dr Gaikaiwari and be honest about the level you've operated at.",

    model:"\u2699 DRAFT SCAFFOLD \u2014 direction only; build the full answer with Ani.\n\nSystematic, evidence-based, and collaborative. Anticoagulants: don't reflexively stop them \u2014 current evidence favours continuing with local haemostatic measures for most simple extractions; check INR for warfarin. Antiresorptives: MRONJ risk assessment (drug, route, duration, comorbidities) \u2014 draw on your post-extraction MRONJ screening. Diabetes: glycaemic control, infection and healing risk. Liaise with the treating physician where needed.",

  {
    id:"q22",
    category:"CLINICAL",
    question:"During an extraction a root tip fractures close to the IAN. What do you do?",
    trap:"TRAP: The instinct to \"retrieve it at all costs\" can cause IAN injury. The mature answer weighs retrieval against deliberately leaving a small, deep, asymptomatic fragment.",
    model:"\u2699 DRAFT SCAFFOLD \u2014 direction only; build the full answer with Ani.\n\nStop and reassess \u2014 don't blindly chase the fragment. Radiograph, then weigh retrieval against deliberately leaving a small, deep fragment when it's asymptomatic and close to the IAN (the risk of retrieval may exceed the risk of leaving it). Informed consent for whichever path, document clearly, arrange follow-up, and escalate or refer if it's beyond your comfort.",

    model:"\u2699 DRAFT SCAFFOLD \u2014 direction only; build the full answer with Ani.\n\nUse the non-odontogenic ED case: you recognised a parotid swelling wasn't odontogenic and outside your scope, referred to OMFS, and then worked alongside them. Frame it as judgment and patient safety \u2014 knowing the limit is a surgical skill, not a shortfall.",

  {id:'q13',model:`I'll be specific, because I think vagueness on this question is a way of hiding rather than answering it.

The first complication: [INSERT INTRA-OPERATIVE CASE — use SBAR: Situation: what was the case, what procedure, what patient. Complication: what happened — root fracture, IAN involvement, haemorrhage, oro-antral communication, tuberosity fracture — and when you recognised it. Action: exactly what you did immediately. Outcome: what happened for the patient. Learning: what changed in how you practise].

The second: [INSERT POST-OPERATIVE CASE — dry socket, surgical site infection, post-op haemorrhage, nerve paraesthesia. Same SBAR structure. Be specific about the presentation, your clinical diagnosis, and your management].

The third — and this is the one I think is most important to be honest about: [INSERT PROCESS OR COMMUNICATION COMPLICATION — a consent gap, a near-miss involving wrong-site risk, a failure of follow-up that led to a worse outcome, a communication breakdown between you and another clinician. This one shows you understand that complications aren't only technical].

The through-line in all three is the same: early recognition matters more than perfect prevention, because complications in surgery are not fully preventable. What's preventable is failure to recognise, failure to escalate, and failure to communicate honestly with the patient about what happened. In each of these cases, [CLOSE WITH WHAT SPECIFICALLY CHANGED IN YOUR PRACTICE AS A RESULT].`,category:'COMPLICATIONS',question:'Three surgical complications you\'ve had to deal with',trap:'HIGH STAKES: This tests clinical honesty, not surgical perfection. Candidates who claim they\'ve never had complications, or describe only trivial ones, fail this. The question tests: did you recognise it? Did you manage it correctly? Did you learn from it?',steps:[
    {label:'Structure for each: SBAR format',guidance:'Situation (what was the case) → Complication (what happened, when you recognised it) → Action (immediate management) → Outcome (result for patient) → Learning (what changed in your practice).',prompt:'',isExp:false},
    {label:'Complication 1 — intra-operative',guidance:'Root displacement, IAN involvement, haemorrhage, tuberosity fracture, oro-antral communication.',prompt:'Walk through a real case. What happened? How did you recognise it? What did you do immediately?',isExp:true},
    {label:'Complication 2 — post-operative',guidance:'Dry socket, surgical site infection, delayed healing, post-op haemorrhage, nerve paraesthesia.',prompt:'A patient who came back with a problem. How did you diagnose and manage it?',isExp:true},
    {label:'Complication 3 — system or communication',guidance:'A process, consent, or communication failure that led to a near-miss. Shows you understand that complications are not only technical.',prompt:'A time when process, not just technique, was the issue.',isExp:true},
    {label:'Closing statement',guidance:'"Complications are inevitable in surgery. What matters is early recognition, appropriate escalation, honest communication with the patient, and systematic reflection to prevent recurrence."',prompt:'',isExp:false},
  ]},
  {id:'q07',model:`Patient safety comes first. There's no version of this where I give a colleague the benefit of the doubt if I have reasonable belief they're impaired and treating patients.

Under AHPRA's mandatory notification obligations, a registered practitioner who forms a reasonable belief that a colleague's impairment is placing the public at risk has a duty to notify. Reasonable belief doesn't require certainty — observable impairment is enough. I don't need a confirmed drug test result. I need to have seen enough to form that belief.

My immediate steps: I would remove the colleague from patient care if it was safe and within my authority to do so — or raise it with the department head immediately if it wasn't. I would document exactly what I observed, factually, without interpretation. And I would notify AHPRA if the concern met the mandatory notification threshold, which impairment placing the public at risk clearly does.

The welfare dimension matters, and I take it seriously — but it comes second, not first. Once patients are protected, I would want to support the colleague in accessing help — EAP, occupational health, their own treating practitioner. A colleague who is dependent on substances is also a person who needs support. But that support cannot come at the cost of patient safety, and it cannot be used to rationalise delay in notifying.

What I won't do: I won't have a quiet word and hope it resolves. I won't give them the benefit of the doubt because I value the working relationship. I won't delay notification because I'm worried about their career. Those are the responses that lead to patient harm.`,category:'PROFESSIONALISM',question:'A colleague is using recreational drugs — how do you handle it?',trap:'TRAP: There is only one right answer and it\'s not "I\'d have a quiet word with them." Failure to report is a mandatory notification issue under AHPRA. Candidates who hedge or prioritise collegiality over patient safety fail this question.',steps:[
    {label:'Lead with patient safety — no hesitation',guidance:'"My primary obligation is patient safety. If I have reasonable belief a colleague is impaired, I have a duty to act — both ethically and under AHPRA mandatory notification obligations."',prompt:'',isExp:false},
    {label:'What "reasonable belief" means',guidance:'You don\'t need certainty. Observable impairment — behavioural changes, errors, smell, direct evidence — is sufficient to trigger a duty.',prompt:'',isExp:false},
    {label:'Immediate action steps',guidance:'(1) Remove colleague from patient care if safe to do so. (2) Escalate to supervisor/department head immediately. (3) Document what you observed factually. (4) Notify AHPRA if the concern meets the mandatory notification threshold.',prompt:'',isExp:false},
    {label:'Welfare — second, not first',guidance:'Acknowledge this is also a welfare issue and that you\'d support the colleague accessing EAP or occupational health. But this comes after patient safety, not instead of it.',prompt:'',isExp:false},
    {label:'What you do NOT say',guidance:'"I\'d give them the benefit of the doubt." "I\'d have a quiet word first." "I wouldn\'t want to ruin their career." These are failing answers.',prompt:'',isExp:false},
  ]},
  {
    id:"q27",
    category:"PROFESSIONALISM",
    question:"A consultant asks you to perform a procedure you don't feel competent to do. What do you do?",
    trap:"TRAP: \"I'd just do it because they're senior\" fails \u2014 it's a patient-safety and boundary issue. Flat refusal with no communication also fails.",
    model:"\u2699 DRAFT SCAFFOLD \u2014 direction only; build the full answer with Ani.\n\nPatient safety sits above hierarchy. Respectfully decline to proceed unsupervised, explain specifically where your competence ends, and offer the safe alternative \u2014 supervision, or the consultant performing it while you assist and learn. Document. Seniority doesn't override your professional responsibility for a patient on your hands.",
    steps:[
      {label:"Patient safety over hierarchy",guidance:"The patient's safety is the fixed point, not the power gradient.",prompt:"",isExp:false},
      {label:"Respectful, specific communication",guidance:"Name exactly where your competence ends \u2014 not a vague refusal.",prompt:"",isExp:false},
      {label:"Offer the safe alternative",guidance:"Supervision, or them doing it with you assisting \u2014 turn it into a learning opportunity.",prompt:"",isExp:false},
    ]},
  {
    id:"q29",
    category:"PROFESSIONALISM",
    question:"You realise you've made an error the patient hasn't noticed. What do you do?",
    trap:"HIGH STAKES: The honest answer is open disclosure. \"If they didn't notice, no harm done\" is a serious professionalism failure the panel is listening for.",
    model:"\u2699 DRAFT SCAFFOLD \u2014 direction only; build the full answer with Ani.\n\nOpen disclosure, without hesitation. Tell the patient, apologise sincerely, explain what happened and the plan to put it right, document it, and report it through clinical governance. The fact that they didn't notice changes nothing \u2014 honesty is the professional obligation, and concealment is the real risk to them and to your registration.",
    steps:[

    ]},

  {id:'q16',model:`I don't avoid conflict — I've had disagreements with colleagues, and pretending otherwise wouldn't be credible in a clinical environment where people have strong views about complex decisions.

My approach is direct and early. Letting a conflict sit and fester in a clinical environment costs patient care — decisions get made by avoidance rather than judgment. So I address it directly, with the person, not by email, not through a third party.

The structure I try to apply: separate the person from the issue, because in most clinical disagreements the conflict is about a clinical or professional matter rather than the relationship. And try to find the underlying interest rather than arguing over stated positions — often two people disagreeing about a treatment plan are actually worried about different things, and that's findable.

A specific example: [INSERT REAL CONFLICT EXAMPLE — disagreement with a colleague about a treatment plan, a referral that was rejected, a clinical decision you disagreed with a senior about, a scheduling conflict that affected patient care. Walk through: what was the issue, what did you do, what was the outcome].

The escalation point is important. If a conflict involves patient safety, professional conduct, or something that crosses into discrimination or harassment, the informal resolution approach is not appropriate. I know the difference, and I know when to escalate formally. The obligation to the patient or the institution supersedes the obligation to maintain a comfortable working relationship.`,category:'PROFESSIONALISM',question:'Managing conflicts with colleagues',trap:'TRAP: Don\'t say you avoid conflict or "always find common ground." This sounds unbelievable and suggests you either avoid difficult conversations or don\'t recognise conflict when it occurs.',steps:[
    {label:'Acknowledge conflict is normal — don\'t apologise for it',guidance:'"Conflict in a clinical environment is inevitable when there are competing priorities, limited resources, and high-stakes decisions. The question is how you manage it, not whether it happens."',prompt:'',isExp:false},
    {label:'Your structured approach',guidance:'(1) Address directly and early — not by email, not via third parties. (2) Separate the person from the issue. (3) Identify the underlying interest, not just the stated position. (4) Escalate appropriately if unresolved.',prompt:'',isExp:false},
    {label:'A real example',guidance:'You need one. It doesn\'t have to be dramatic — a disagreement about a treatment plan, a referral being rejected, a scheduling conflict with patient impact.',prompt:'A specific disagreement with a colleague, senior, or another specialty. What was the issue? What did you do? What was the outcome?',isExp:true},
    {label:'When to escalate',guidance:'If the conflict involves patient safety, professional conduct, or discrimination — this is not a conflict to resolve informally. State explicitly that you know when escalation is the right call.',prompt:'',isExp:false},
  ]},
  {id:'q01',model:`At Westmead I participate in three audit cycles: IMS — which covers infection control compliance, sterilisation protocols and PPE — peer review, where we discuss complex cases and treatment planning decisions as a team, and records audits, which examine consent documentation and referral completeness. My role in each is as a participant and reviewer rather than lead — I've been the person checking records against the standard, flagging non-conformances, and feeding findings back to the team.

The part that mattered most was what changed. In one records audit we identified inconsistent pre-operative radiograph documentation for surgical cases — OPGs weren't always recorded in the notes even when taken. We updated our pre-extraction surgical checklist as a direct result. That's the point of audit: not the data collection, but the practice change.

Looking ahead to an oral surgery training environment, I'd expect audit to extend further — to surgical site infection rates, complication frequency and type, consent quality for irreversible procedures, and follow-up attendance rates. These are the metrics that tell you whether a surgical service is actually safe, not just compliant.`,category:'GOVERNANCE',question:'What audits are you involved in?',trap:null,steps:[
    {label:'Name the audits with purpose',guidance:'State each audit clearly — IMS, peer review, records audit. Don\'t just list them. Briefly say what each one measures.',prompt:'e.g. IMS: infection control compliance, PPE, sterilisation protocols. Peer review: case discussion, treatment planning alignment. Records audit: consent documentation, referral completeness.',isExp:false},
    {label:'Your specific role in each',guidance:'Were you a participant, initiator, reviewer, panel member? Say it specifically.',prompt:'e.g. "At Westmead I participate in quarterly records audits — my role is reviewing consent documentation for surgical cases."',isExp:true},
    {label:'What changed as a result',guidance:'This is the part most candidates skip. Examiners want to know audits drove change, not just happened.',prompt:'e.g. "One audit identified inconsistent pre-op radiograph documentation — we updated our pre-extraction checklist as a result."',isExp:true},
    {label:'Closing link to oral surgery',guidance:'Tie it to the surgical context: "In a surgical setting, I\'d expect audit to extend to surgical site infection rates, consent quality, and complication documentation."',prompt:'',isExp:false},
  ]},
  {id:'q02',model:`Clinical governance is the framework through which health organisations are accountable for continuously improving quality and safeguarding standards — it's the system that makes safety and improvement structural rather than dependent on individual goodwill.

In practice, I engage with it across several pillars. Audit I've covered — at Westmead that's ongoing. Education and training is part of every clinical session, both receiving and contributing to it. Risk management comes into every surgical case in how I assess and document, how I escalate, how I obtain consent. Patient experience feeds directly into that — and I've had cases where patient feedback genuinely changed my practice. [INSERT SPECIFIC EXAMPLE].

The patient's role is something I think about carefully. Informed consent isn't just a legal formality — it's the patient exercising governance over their own care. When a patient asks why we're extracting rather than restoring, or raises a concern about a proposed treatment plan, that's governance functioning correctly. Patient complaints are quality data. In the public hospital setting, consumer advisory input into service design is a genuine mechanism — not just tokenistic.

In oral surgery specifically, this matters more than in most dental disciplines. We're doing irreversible procedures, often under sedation or GA. The quality of the consent process, and the patient's genuine comprehension of it, is a governance issue with direct clinical consequences.`,category:'GOVERNANCE',question:'Clinical governance role in oral surgery — what is a patient\'s role in governance?',trap:null,steps:[
    {label:'Define clinical governance briefly',guidance:'"Clinical governance is the system by which organisations are accountable for continuously improving quality and safeguarding high standards of care."',prompt:'',isExp:false},
    {label:'Core pillars you have participated in',guidance:'Pick 4–5: audit, education & training, risk management, patient experience, evidence-based practice, staffing & performance.',prompt:'Which of these have you directly participated in at Westmead or Kings Family?',isExp:true},
    {label:'Patient\'s role in governance',guidance:'(1) Informed consent as governance. (2) Patient feedback/complaints as quality data. (3) Patient involvement in service design. (4) Patients as safety partners — speaking up if something feels wrong.',prompt:'Have you ever acted on patient feedback to change your practice? Even one example.',isExp:true},
    {label:'Oral surgery specific link',guidance:'Consent for irreversible procedures, shared decision-making for extractions vs. restoration, managing patient anxiety as a governance issue.',prompt:'',isExp:false},
  ]},
  {id:'q03',model:`Evidence-based practice means integrating three things simultaneously: the best available external evidence, my own clinical expertise and judgment, and the patient's values and preferences. The mistake is treating it as just "looking things up" — without clinical judgment, the evidence can't be applied, and without patient values, the right treatment for the condition may be the wrong treatment for the person.

A specific example: I had a patient on warfarin who needed a surgical extraction. The default at the time in the practice was to refer back to the medical team for bridging therapy. I reviewed the current evidence — particularly the literature on local haemostatic measures — and found that for most patients with an INR in the therapeutic range, extraction with local haemostasis is safer than bridging, because bridging carries real thromboembolic risk. I discussed that evidence with the patient's GP and we proceeded with local measures. That's EBP in practice — it changed what we did, and the outcome justified it. [REPLACE WITH YOUR SPECIFIC ANTICOAGULANT OR BISPHOSPHONATE OR OTHER CASE].

I'm also aware that evidence in oral surgery has significant limitations. RCT evidence is sparse for many surgical questions — the hierarchy of evidence needs to account for that. Systematic reviews, expert consensus guidelines, and well-designed retrospective audits fill real gaps. The Cochrane reviews on third molar surgery, for instance, inform my practice even though the evidence is graded moderate at best.

Going forward, I want to be a contributor to that evidence base, not just a consumer of it. The GradDip research project is a genuine opportunity — I'm interested in [INSERT RESEARCH INTEREST], which is an area where the existing literature has clear gaps.`,category:'EVIDENCE',question:'Evidence-based research — significance and impact on your practice',trap:null,steps:[
    {label:'Define EBP correctly — three pillars',guidance:'Best available evidence + clinical expertise + patient values/preferences. Don\'t just say "using research."',prompt:'',isExp:false},
    {label:'A specific example from your practice',guidance:'Name a clinical question you had, what you looked up, what you found, and what changed in your practice.',prompt:'e.g. "I had a patient on anticoagulants needing extraction — I reviewed current evidence on pre-op INR thresholds and local haemostatic measures, which changed my management away from defaulting to bridging therapy."',isExp:true},
    {label:'Acknowledge limitations of evidence',guidance:'Evidence has hierarchy; RCT evidence in oral surgery is often limited; expert consensus guidelines fill gaps. Shows intellectual maturity.',prompt:'',isExp:false},
    {label:'Link to being a contributor, not just consumer',guidance:'You intend to contribute to the evidence base — research project, audit, case reporting. Forward-looking.',prompt:'Any research interest, even early-stage, you can name here?',isExp:true},
  ]},
  {id:'q12',model:`Public health is the science and practice of protecting and improving the health of populations through policy, education, research, and preventive measures — the defining feature is the population rather than the individual as the unit of concern.

In dentistry, the classic examples are water fluoridation — one of the most cost-effective public health interventions in any field — school dental programs, tobacco cessation campaigns given the direct link between smoking and oral cancer and periodontal disease, and sugar taxation as a downstream lever on caries rates. In Australia specifically, the Aboriginal and Torres Strait Islander oral health gap is a public health failure with decades of documented evidence and insufficient systemic response.

What I want to say directly is that I'm already delivering public health dentistry. At Westmead, the patient population I see is not the private dental patient. These are patients who've avoided care because of cost or access or fear, who present with advanced disease, who have complex medical histories that private practices often refer on. Managing odontogenic infections that have progressed to fascial space involvement because the patient couldn't access timely care — that's a public health failure presenting to me as a clinical case.

The research coming out of the Nepean district on dental infections requiring hospitalisation is directly relevant here — 102 admissions over two years, 68% presenting outside regular working hours, the majority having already received antibiotics from a GP without active dental treatment. That's a system problem, not an individual clinical failure. On-call emergency dental services, better GP-dental integration, and improved access models are public health solutions to a problem I see the consequences of every week.`,category:'PUBHEALTH',question:'What is public health and some examples of public health?',trap:null,steps:[
    {label:'Definition — population focus',guidance:'"Public health is the science and practice of protecting and improving the health of populations through education, policy, research, and preventive measures — focused on communities rather than individuals."',prompt:'',isExp:false},
    {label:'Examples relevant to oral health',guidance:'(1) Water fluoridation. (2) School dental programs. (3) Tobacco cessation campaigns. (4) Sugar taxes and dietary policy. (5) Aboriginal and Torres Strait Islander oral health programs. (6) Hospital public dental services for disadvantaged populations.',prompt:'',isExp:false},
    {label:'You are already delivering public health dentistry',guidance:'Westmead is a public hospital. The patients you see — medically complex, socioeconomically diverse, referred from the public waitlist — are the people public health is designed to serve. Own this directly.',prompt:'What patient populations do you see at Westmead you wouldn\'t see in private? Any specific health equity issues you\'ve encountered?',isExp:true},
    {label:'Oral surgery and public health intersection',guidance:'Oral cancer screening, access to surgical care for underserved populations, management of odontogenic infections in patients who\'ve avoided dental care — these are public health issues oral surgeons directly address.',prompt:'',isExp:false},
  ]},
  {id:'q11',model:`My research experience to date is at the audit and quality improvement end of the spectrum rather than primary research. [INSERT SPECIFIC: audit participation at Westmead, any case reviews, departmental QA work, structured case presentations at clinical meetings, literature reviews for specific clinical questions]. I haven't published, and I'm not going to overstate that. But I understand the methodology of clinical audit — designing the standard, measuring against it, identifying the gap, implementing change, re-auditing — and I know how to distinguish that from research, which generates new knowledge rather than measuring practice against existing standards.

My research interest is [INSERT SPECIFIC AREA]. I'm drawn to it because [CLINICAL REASON — a problem you keep encountering, a gap in the evidence you've noticed, a patient population where better evidence would change practice]. The existing literature in this area has specific gaps: [NAME ONE OR TWO].

I'm aware that this program requires a research project each semester. I'm approaching that requirement as an opportunity rather than an obligation. I'd like to discuss supervisor availability and whether [YOUR INTEREST AREA] maps onto any current departmental research directions — that's one of my questions for you today if we get to it.`,category:'RESEARCH',question:'What research have you done and what are your research interests?',trap:null,steps:[
    {label:'What you have actually done — be honest about level',guidance:'Case reports, audit participation, QA projects, literature reviews, departmental presentations all count. You don\'t need a publication — but you need something.',prompt:'Any audit involvement at Westmead? Case reviews, presentations, departmental work? Even a structured case presentation at a clinical meeting counts.',isExp:true},
    {label:'Research interest — one focused area',guidance:'Don\'t say "I\'m interested in oral surgery research." Name an area: third molar outcomes, surgical site infection, peri-implant disease, MRONJ management, oral cancer screening.',prompt:'What clinical problems do you keep encountering where you wish there was better evidence?',isExp:true},
    {label:'The GradDip research project — show readiness',guidance:'This program requires a research project each semester. Show you understand this and are approaching it with intent, not as a box to tick.',prompt:'Do you have a topic area in mind already? Even a rough question is better than nothing.',isExp:true},
    {label:'Audit vs research distinction',guidance:'Show you understand the difference — audit measures against a standard, research generates new knowledge. Candidates who conflate them look poorly prepared.',prompt:'',isExp:false},
  ]},

  {id:'q06',model:`My CPD over the last two years has been deliberately pointed toward oral surgery rather than general dentistry broadly, which reflects where I intend to take my career.

[INSERT FULL CPD LIST WITH DATES — courses, webinars, conferences, journal clubs, hospital education sessions. For each one, note what changed in your practice, not just what the topic was.]

The surgical-specific activities that matter most to me are [INSERT: any skills days, sedation training, implant courses, trauma management, cadaver workshops if applicable]. These are the ones that directly developed operative competence rather than just knowledge.

Outside formal CPD, I read the Australian Dental Journal and the British Journal of Oral and Maxillofacial Surgery regularly. [INSERT ANY SPECIFIC PAPERS OR TOPICS YOU'VE FOLLOWED]. I'm aware of the recent audit work coming out of the Nepean district on odontogenic infections requiring hospitalisation — that kind of translational research, connecting public hospital data to practice change, is the type of evidence I find most directly applicable to what I do at Westmead.

Going forward, [INSERT PLANNED CPD — ideally something oral surgery-adjacent already booked or in progress].`,category:'CPD',question:'What CPD have you done?',trap:null,steps:[
    {label:'List with intent — not just titles',guidance:'Don\'t recite course names. For each activity: what did you learn, and how did it change your practice?',prompt:'List every CPD activity in the last 2 years — courses, webinars, conferences, journal clubs, hospital education sessions.',isExp:true},
    {label:'Oral surgery-specific CPD',guidance:'Anything directly surgical — IV sedation, implants, surgical technique courses, trauma management — should be named specifically.',prompt:'Any surgical skills days, cadaver workshops, simulation training?',isExp:true},
    {label:'Evidence of self-directed learning',guidance:'Journal reading, textbook use, online modules. Shows you don\'t just clock mandatory hours.',prompt:'What do you read regularly? Any specific journals or texts (e.g. BJOMS)?',isExp:true},
    {label:'Forward-looking CPD intention',guidance:'What CPD are you planning? Ideally something oral surgery-adjacent — shows the trajectory is already pointing toward this program.',prompt:'',isExp:false},
  ]},
  {id:'q14',model:`I've taught in [INSERT CONTEXTS — dental students at Westmead, junior staff at Kings Family, any formal teaching sessions, chairside teaching during procedures]. The most valuable teaching I've done has been informal and operative — explaining what I'm doing and why, mid-procedure, to someone watching. That's harder than it sounds, because it requires you to articulate assumptions you've made automatically.

What teaching has revealed to me about my own practice: [INSERT SPECIFIC MOMENT — a time where trying to explain something made you realise you hadn't consciously examined your own reasoning]. That's the best argument for teaching as a component of training — it forces self-examination.

The biggest challenge I anticipate is one that the evidence actually documents: ensuring learners get sufficient operative time in a busy clinical environment. The temptation — and I've felt it — is to take over when a case is going slowly or getting difficult, because it's faster and feels safer. But that robs the learner of exactly the experience they need. The research on COVID's impact on dental student surgical training showed clearly that reduced supervised operative exposure produced graduates with less confidence and competence. That finding should make every supervisor more deliberate about handing over rather than taking back.

The second challenge is calibrating feedback. Telling a learner they're not progressing, or that a specific behaviour needs to change, is uncomfortable. But vague positive feedback is useless and actively misleading. I'd rather have a difficult honest conversation than watch someone leave training without the skills they needed.`,category:'TEACHING',question:'Experience in teaching — biggest challenge you anticipate when teaching',trap:null,steps:[
    {label:'Your actual teaching experience',guidance:'Be specific: teaching dental students, junior staff, other trainees. Formal sessions vs informal chairside teaching. Any curriculum design involvement.',prompt:'Who have you taught? In what setting? Any formal teaching roles at Westmead?',isExp:true},
    {label:'What teaching has taught you about yourself',guidance:'The best answer shows teaching changed how you think clinically — explaining a procedure forces you to articulate assumptions you didn\'t know you held.',prompt:'A moment where teaching someone made you realise something about your own practice.',isExp:true},
    {label:'Biggest challenge — be honest and specific',guidance:'Strong answers: (1) Pitching explanation to the learner\'s actual knowledge level, not your assumption of it. (2) Teaching under time pressure — the temptation to "just do it." (3) Managing a learner who isn\'t progressing.',prompt:'Which of these resonates most with your actual experience?',isExp:true},
    {label:'What NOT to say',guidance:'"Keeping them engaged" — too generic, no clinical insight. Every candidate says this.',prompt:'',isExp:false},
  ]},
  {id:'q15',model:`Leadership in oral surgery starts at the chair, not the committee room. In a surgical environment, the oral surgeon is directing the team — communicating with the scrub nurse, managing the assistant, coordinating with anaesthetics, making time-sensitive decisions about how to proceed when the operative picture changes. That's leadership in the most direct sense: people are following your judgment in real time.

At a departmental level, leadership shows up in audit participation, in protocol development, in contributing to how training is structured. [INSERT IF APPLICABLE: any committee involvement, working group, protocol you've contributed to or suggested, quality improvement initiative at Westmead].

Teaching is a form of leadership that I take seriously. Investing in the competence of the next generation of practitioners shapes the specialty over time in a way that individual clinical work doesn't. The oral surgeon who commits to genuine trainee development — not just supervision, but deliberate teaching — has a multiplier effect on the profession.

My own leadership style is collaborative but directive when it needs to be. In a clinical environment, there are moments when discussion is appropriate and moments when someone needs to give a clear instruction. I've learned to distinguish between them. [INSERT SPECIFIC EXAMPLE of taking the lead — clinical decision, team communication, managing a difficult situation].`,category:'TEACHING',question:'What is the oral surgeon\'s role in leadership?',trap:null,steps:[
    {label:'Clinical leadership at the chair — start here',guidance:'The oral surgeon leads the surgical team — directing nurses, assistants, communicating with anaesthetists. Decision-making authority in the operating environment is leadership. Don\'t start with management committees.',prompt:'',isExp:false},
    {label:'Departmental and institutional leadership',guidance:'Audit lead, committee membership, protocol development, curriculum contribution. Even as a trainee you can contribute — show you\'re thinking about this.',prompt:'Any committee or working group involvement at Westmead? Any protocol you\'ve contributed to or suggested?',isExp:true},
    {label:'Teaching as leadership',guidance:'Training the next generation is professional leadership. The oral surgeon who invests in trainee development shapes the specialty.',prompt:'',isExp:false},
    {label:'Your leadership style — briefly',guidance:'Don\'t just describe what leadership is. Say something about how you lead. Collaborative? Evidence-driven? Do you lead by example at the chair?',prompt:'A time you took the lead on something, even informally — clinical decision, team communication, process improvement.',isExp:true},

  {id:'q10',model:`My strongest attribute clinically is adaptability under pressure. I've had cases where the intra-operative picture was materially different from what the radiograph suggested — and the outcome depended on making a calm decision about how to proceed rather than pushing ahead with the original plan. [INSERT SPECIFIC EXAMPLE]. That capacity to reassess mid-procedure without escalating to panic is something I've developed through experience, and I think it's a genuine surgical asset.

The second strength I'd name is patient communication, particularly with anxious patients. A significant proportion of the patients I see — especially at Westmead — arrive with dental fear that has already delayed treatment to the point of complication. Managing that anxiety well isn't just kindness; it's clinical. [INSERT SPECIFIC EXAMPLE of managing a highly anxious or avoidant patient].

My genuine weakness — and I want to be specific rather than give you a comfortable answer — is [INSERT REAL WEAKNESS: e.g. surgical speed and efficiency in complex third molar cases, experience with certain anatomical variants, managing conflict with senior colleagues, experience with specific procedure types]. I'm aware of it because [SPECIFIC EVIDENCE — what a supervisor said, a case that exposed it, a pattern you've noticed]. What I'm doing about it: [CONCRETE ACTION — specific CPD, deliberate practice focus, seeking supervised exposure to that case type].`,category:'SELF',question:'Strengths and weaknesses',trap:'TRAP: "My weakness is I\'m a perfectionist" is not an answer. It signals lack of self-awareness and every panel has heard it hundreds of times. Name a real weakness.',steps:[
    {label:'Strengths — specific and evidence-based',guidance:'Pick 2–3 genuine strengths. For each: name it, give an example that demonstrates it, link it to oral surgery.',prompt:'e.g. Clinical adaptability — describe a case where you had to change approach mid-procedure. OR Patient communication — describe managing an anxious surgical patient.',isExp:true},
    {label:'Weakness — real, with mitigation plan',guidance:'Format: "One area I\'m working on is [genuine gap]. I\'m aware of this because [specific evidence]. Here\'s what I\'m doing about it [concrete action]."',prompt:'Consider — surgical confidence in complex cases? Speed and efficiency? Experience with specific procedure types? What does your supervisor actually say?',isExp:true},
    {label:'Calibrate the weakness correctly',guidance:'The weakness should be real but not disqualifying for oral surgery. A weakness in endodontics is fine. A weakness in managing surgical complications is not the thing to lead with.',prompt:'',isExp:false},

  {id:'q08',model:`The transition from supervised to fully independent surgical practice is the challenge I think about most honestly. During training there's always a consultant, a safety net, someone to escalate to. When that's gone, the judgment calls are entirely mine — on case selection, on when to stop and refer, on how to manage an intra-operative complication that's going beyond my comfort level. Building the internal threshold for when to ask for help, and the professional network to ask, before that transition happens is something I'm actively working on.

The second challenge is the medically complex patient. Oral surgery patients are older, sicker, and on more medications than the average dental patient. Managing a surgical case in a patient with active cardiac disease, or renal impairment, or a haematological condition requires a level of medical interface that goes beyond most dental training. The GradDip is where I intend to develop that systematic approach — but I'm under no illusion that one year gives me everything. Building relationships with medical colleagues and maintaining the habit of seeking advice is a career-long practice.

The third is building a referral base. Technical competence doesn't create a practice — referring dentists need to trust you, and that trust is built over years through consistent communication, reliable outcomes, and professional relationships. Whether I end up in a public or private setting, that professional identity-building takes deliberate effort.

[IF RELEVANT: The fourth challenge — and I raise it because I think it's honest — is that as an international graduate in a specialty where most practitioners are Australian-trained, I've had to be more deliberate about demonstrating competence and building credibility. That's not a complaint — it's made me more rigorous. But it's a real factor in how I've had to approach my career, and it'll continue to be.]`,category:'FUTURE',question:'Challenges you will face when you finish the course',trap:null,steps:[
    {label:'Avoid soft challenges',guidance:'"Time management" or "work-life balance" wastes this answer. Pick real clinical and professional challenges that show self-awareness about the specialty.',prompt:'',isExp:false},
    {label:'Challenge 1 — independent surgical practice',guidance:'Transition from supervised to unsupervised operative decision-making. No registrar safety net. How will you manage: low threshold for seeking advice, peer networks, continuing mentorship.',prompt:'Are there cases now where you still feel uncertain? That self-awareness is exactly the right tone.',isExp:true},
    {label:'Challenge 2 — medically complex patients',guidance:'Oral surgery patients skew older and more medically complex. Interface with medicine, anaesthetics, haematology. Name any gaps and say how you\'ll address them during training.',prompt:'',isExp:false},
    {label:'Challenge 3 — building a referral network',guidance:'Whether public or private, you\'ll need referring dentists to trust you. Professional reputation-building takes time and is relationship-dependent.',prompt:'',isExp:false},
    {label:'Optional — career trajectory context',guidance:'As an international graduate, navigating professional identity and credibility in a specialty where most are locally trained is a real challenge. Raise this only if you can speak to it confidently.',prompt:'Has this been a factor in your career so far? How have you navigated it?',isExp:true},
  ]},
  {id:'q17',model:`Three questions, if that's appropriate.

First: how is operative exposure structured across the year — is there a deliberate progression from foundational dentoalveolar procedures to more complex cases, and how are decisions made about when a trainee is ready to advance?

Second: the program requires a research project each semester. I'm interested in [YOUR RESEARCH INTEREST] — I'd like to understand how students typically identify their project and supervisor, and whether there are active departmental research directions that students can contribute to.

Third: for students who complete the GradDip and wish to progress to the Doctor of Clinical Dentistry in Oral Surgery, what does that transition process look like, and is continuity of supervisor relationship typical?`,category:'CLOSING',question:'Do you have any questions for us?',trap:'TRAP: "No, I think you\'ve covered everything" is a failing answer. Not having questions signals disengagement or inadequate preparation. Prepare at least two.',steps:[

function getDaysRemaining() {
  const interview = new Date('2026-07-02');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.max(0, Math.ceil((interview - today) / 86400000));
}

function getTotalProgress() {
  let total = 0, done = 0;
  QUESTIONS.forEach(q => q.steps.forEach((s,i) => {
    if (s.isExp) { total++; if (state.checked[`${q.id}-${i}`]) done++; }
  }));
  return total === 0 ? 0 : Math.round(done / total * 100);
}

function el(tag, cls, attrs) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (attrs) Object.entries(attrs).forEach(([k,v]) => { if (k === 'text') e.textContent = v; else if (k === 'html') e.innerHTML = v; else e.setAttribute(k,v); });
  return e;
}

function renderOriginToggle(){
  const wrap = el('div','origin-toggle');
  const opts = [['ALL','All'],['original','Original'],['added','Added']];
  opts.forEach(([val,label])=>{
    const n = val==='ALL' ? QUESTIONS.length
            : val==='original' ? QUESTIONS.filter(q=>!isAdded(q.id)).length
            : QUESTIONS.filter(q=>isAdded(q.id)).length;
    const b = el('button','origin-tog-btn'+(state.originFilter===val?' active':''));
    b.innerHTML = `${label} <span class="otog-count">${n}</span>`;
    b.addEventListener('click', ()=>{ state.originFilter = val; render(); });
    wrap.appendChild(b);
  });
  return wrap;
}
